# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "AI Accelerator for CNN"
  team: "Maxilerator"
  discord: "irene_raphael, amxlanil, muhammedrabin, myx_on_57134, maroonchocopie"
  description: "Parameterizable output-stationary systolic array accelerator for streaming matrix multiplication"
  lvs_config: "lvs_config.json"


# ======================================================
# Pin list
#
# ACE slot:
#   WEST  : W07-W22
#   NORTH : N01-N16
#
# Intentionally unused pad positions are explicitly included
# as analog NC pads according to organizer guidance.
# ======================================================

pins:

  # ====================================================
  # WEST EDGE
  # ====================================================

  # W07
  - name: VDD
    io_type: power

  # W08
  - name: VSS
    io_type: ground

  # W09
  - name: W09_NC
    io_type: analog
    secondary_esd: false

  # W10
  - name: W10_NC
    io_type: analog
    secondary_esd: false

  # W11
  - name: rst_n
    io_type: input_cmos

  # W12
  - name: W12_NC
    io_type: analog
    secondary_esd: false

  # W13
  - name: W13_NC
    io_type: analog
    secondary_esd: false

  # W14
  - name: clk
    io_type: input_schmitt

  # W15
  - name: W15_NC
    io_type: analog
    secondary_esd: false

  # W16
  - name: W16_NC
    io_type: analog
    secondary_esd: false

  # W17
  - name: a_valid_i
    io_type: input_cmos

  # W18
  - name: a_last_i
    io_type: input_cmos

  # W19
  - name: a_ready_o
    io_type: bidirectional_24ma

  # W20
  - name: b_valid_i
    io_type: input_cmos

  # W21
  - name: b_last_i
    io_type: input_cmos

  # W22
  - name: b_ready_o
    io_type: bidirectional_24ma


  # ====================================================
  # NORTH EDGE
  # ====================================================

  # N01
  - name: N01_NC
    io_type: analog
    secondary_esd: false

  # N02
  - name: N02_NC
    io_type: analog
    secondary_esd: false

  # N03
  - name: N03_NC
    io_type: analog
    secondary_esd: false

  # N04
  - name: N04_NC
    io_type: analog
    secondary_esd: false

  # N05
  - name: data[0]
    io_type: bidirectional_24ma

  # N06
  - name: data[1]
    io_type: bidirectional_24ma

  # N07
  - name: data[2]
    io_type: bidirectional_24ma

  # N08
  - name: data[3]
    io_type: bidirectional_24ma

  # N09
  - name: data[4]
    io_type: bidirectional_24ma

  # N10
  - name: data[5]
    io_type: bidirectional_24ma

  # N11
  - name: data[6]
    io_type: bidirectional_24ma

  # N12
  - name: data[7]
    io_type: bidirectional_24ma

  # N13
  - name: N13_NC
    io_type: analog
    secondary_esd: false

  # N14
  - name: out_valid_o
    io_type: bidirectional_24ma

  # N15
  - name: out_last_o
    io_type: bidirectional_24ma

  # N16
  - name: out_ready_i
    io_type: input_cmos
